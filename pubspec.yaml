name: parksmart
description: Smart parking management - Antananarivo
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.3.0

  # Navigation
  go_router: ^13.0.0

  # State management
  flutter_riverpod: ^2.4.0

  # Maps (FREE - no API key)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # UI & Design
  google_fonts: ^6.1.0
  flutter_tabler_icons: ^1.2.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^4.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.0
  shared_preferences: ^2.2.0
  cached_network_image: ^3.3.0
  connectivity_plus: ^6.0.0
  http: ^1.2.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

